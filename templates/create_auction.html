{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Auction</title>

<style>

/* RESET */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI', sans-serif;
}

/* BODY */

body{
min-height:100vh;
overflow-x:hidden;

background:
radial-gradient(circle at top left, rgba(0,242,254,.12), transparent 25%),
radial-gradient(circle at bottom right, rgba(147,51,234,.12), transparent 25%),
#020617;

color:white;
position:relative;
}

/* ANIMATED BG */

.bg-glow{
position:fixed;
width:500px;
height:500px;
border-radius:50%;

background:rgba(0,242,254,.08);

filter:blur(90px);

top:-120px;
left:-120px;

animation:floatGlow 8s ease infinite alternate;
z-index:0;
}

.bg-glow2{
position:fixed;
width:500px;
height:500px;
border-radius:50%;

background:rgba(147,51,234,.08);

filter:blur(90px);

bottom:-120px;
right:-120px;

animation:floatGlow2 8s ease infinite alternate;
z-index:0;
}

@keyframes floatGlow{
from{
transform:translateY(0px);
}
to{
transform:translateY(40px);
}
}

@keyframes floatGlow2{
from{
transform:translateY(0px);
}
to{
transform:translateY(-40px);
}
}

/* HEADER */

.header{
padding:22px 40px;

background:rgba(255,255,255,.04);

backdrop-filter:blur(14px);

font-size:20px;
font-weight:700;

position:sticky;
top:0;
z-index:999;

border-bottom:1px solid rgba(255,255,255,.06);

box-shadow:0 10px 30px rgba(0,0,0,.3);
}

/* WRAPPER */

.wrapper{
display:flex;
justify-content:center;
padding:60px 20px;
position:relative;
z-index:2;
}

/* CARD */

.container{
width:850px;

background:rgba(255,255,255,.05);

backdrop-filter:blur(18px);

padding:45px;

border-radius:28px;

border:1px solid rgba(255,255,255,.06);

box-shadow:
0 20px 50px rgba(0,0,0,.45),
0 0 50px rgba(0,242,254,.08);

animation:fadeUp .8s ease;
}

/* ANIMATION */

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* TITLE */

.title{
text-align:center;
margin-bottom:40px;
}

.title h2{

font-size:42px;
font-weight:900;

background:linear-gradient(
90deg,
#00f2fe,
#3b82f6,
#9333ea,
#00f2fe
);

background-size:300%;

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

animation:gradientMove 5s linear infinite;
}

@keyframes gradientMove{
0%{
background-position:0%;
}
100%{
background-position:300%;
}
}

.title p{
color:#aaa;
font-size:15px;
margin-top:10px;
}

/* MESSAGE */

.message{
margin-bottom:20px;
padding:14px;
border-radius:12px;

background:rgba(239,68,68,.12);
border:1px solid rgba(239,68,68,.2);

color:#ff6b6b;
text-align:center;
}

/* SECTION */

.section{
margin-bottom:35px;
}

/* SECTION TITLE */

.section h3{
margin-bottom:18px;
font-size:18px;
color:#00f2fe;
font-weight:700;
}

/* GRID */

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:22px;
}

/* INPUT */

.input-box{
display:flex;
flex-direction:column;
}

.input-box label{
font-size:13px;
margin-bottom:8px;
color:#bbb;
font-weight:500;
}

.input-box input{
padding:15px;
border-radius:14px;

border:1px solid rgba(255,255,255,.1);

background:rgba(255,255,255,.04);

color:white;
outline:none;

transition:.3s;
font-size:15px;
}

.input-box input:focus{
border-color:#00f2fe;

box-shadow:
0 0 20px rgba(0,242,254,.2);

transform:translateY(-2px);
}

/* FILE UPLOAD */

.file-upload{
border:2px dashed rgba(255,255,255,.12);

padding:40px;

text-align:center;

border-radius:18px;

cursor:pointer;

transition:.3s;

background:rgba(255,255,255,.03);
}

.file-upload:hover{
border-color:#00f2fe;
background:rgba(0,242,254,.04);

transform:translateY(-3px);
}

.file-upload input{
display:none;
}

.upload-icon{
font-size:45px;
margin-bottom:12px;
}

.upload-text{
font-size:16px;
font-weight:600;
}

.upload-sub{
margin-top:6px;
font-size:13px;
color:#888;
}

/* ACTIONS */

.actions{
margin-top:40px;

display:flex;
justify-content:space-between;
align-items:center;
}

/* BACK */

.back{
text-decoration:none;
color:#aaa;
font-size:15px;
transition:.3s;
}

.back:hover{
color:#00f2fe;
transform:translateX(-3px);
}

/* BUTTON */

.save{
padding:16px 36px;

border:none;
border-radius:14px;

background:linear-gradient(
90deg,
#00f2fe,
#3b82f6,
#9333ea
);

color:white;
font-size:15px;
font-weight:700;

cursor:pointer;

transition:.3s;
}

.save:hover{
transform:translateY(-3px) scale(1.03);

box-shadow:
0 15px 35px rgba(0,242,254,.25);
}

/* RESPONSIVE */

@media(max-width:768px){

.form-grid{
grid-template-columns:1fr;
}

.container{
padding:28px;
}

.title h2{
font-size:32px;
}

.actions{
flex-direction:column;
gap:18px;
}

.save{
width:100%;
}

}

</style>

</head>

<body>

<!-- GLOW -->
<div class="bg-glow"></div>
<div class="bg-glow2"></div>

<!-- HEADER -->

<div class="header">
🏏 Cricket Bidding System
</div>

<!-- MAIN -->

<div class="wrapper">

<div class="container">

<!-- TITLE -->

<div class="title">

<h2>Create Auction</h2>

<p>
Build your premium live cricket auction experience
</p>

</div>

<!-- MESSAGES -->

{% for message in messages %}
<div class="message">
{{ message }}
</div>
{% endfor %}

<!-- FORM -->

<form method="POST" enctype="multipart/form-data">

{% csrf_token %}

<!-- LOGO -->

<div class="section">

<h3>🏆 Auction Logo</h3>

<label class="file-upload">

<div class="upload-icon">
📤
</div>

<div class="upload-text">
Upload Auction Logo
</div>

<div class="upload-sub">
Only JPG / JPEG / PNG allowed
</div>

<input
type="file"
name="auction_logo"
accept=".jpg,.jpeg,.png"
required
>

</label>

</div>

<!-- INFO -->

<div class="section">

<h3>📋 Auction Information</h3>

<div class="form-grid">

<div class="input-box">

<label>Auction Name</label>

<input
name="auction_name"
placeholder="Enter auction name"
required
>

</div>

<div class="input-box">

<label>Auction Date</label>

<input
type="date"
name="auction_date"
required
>

</div>

</div>

</div>

<!-- SETTINGS -->

<div class="section">

<h3>⚙️ Auction Settings</h3>

<div class="form-grid">

<div class="input-box">

<label>Points Per Team</label>

<input
type="number"
name="points_per_team"
placeholder="Example: 10000"
required
>

</div>

<div class="input-box">

<label>Minimum Bid</label>

<input
type="number"
name="minimum_bid"
placeholder="Example: 500"
required
>

</div>

<div class="input-box">

<label>Bid Increase By</label>

<input
type="number"
name="bid_increase_by"
placeholder="Example: 100"
required
>

</div>

<div class="input-box">

<label>Players Per Team</label>

<input
type="number"
name="players_per_team"
placeholder="Example: 15"
required
>

</div>

</div>

</div>

<!-- ACTIONS -->

<div class="actions">

<a href="{% url 'dashboard' %}" class="back">
← Back to Dashboard
</a>

<button class="save">
🚀 Create Auction
</button>

</div>

</form>

</div>

</div>

</body>
</html>
