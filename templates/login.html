{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Cricket Bidding System</title>

<style>

/* RESET */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI', sans-serif;
}

/* BODY */

body{

min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

/* CLEAR STADIUM BACKGROUND */
background:url("{% static 'images/stadium1.jpg' %}") center/cover no-repeat fixed;

position:relative;

padding:20px;

}

/* LIGHT OVERLAY */

body::before{

content:"";

position:absolute;
width:100%;
height:100%;

background:linear-gradient(
rgba(8,28,58,0.45),
rgba(8,28,58,0.75)
);

}

/* HOME BUTTON */

.home-btn{

position:absolute;
top:20px;
left:20px;

background:white;

padding:8px 16px;

border-radius:6px;

text-decoration:none;

font-weight:600;

color:#081c3a;

z-index:2;

transition:.3s;

}

.home-btn:hover{

transform:translateY(-2px);
box-shadow:0px 5px 15px rgba(0,0,0,.3);

}

/* LOGIN CARD */

.container{

position:relative;
z-index:2;

background:rgba(255,255,255,0.12);

backdrop-filter:blur(18px);

padding:45px;

width:100%;
max-width:400px;

border-radius:20px;

border:1px solid rgba(255,255,255,0.2);

box-shadow:
0px 25px 80px rgba(0,0,0,.6),
0px 0px 25px rgba(79,172,254,.4);

transition:.4s;

animation:fadeUp .8s ease;

}

/* HOVER EFFECT */

.container:hover{

transform:translateY(-5px) scale(1.01);

box-shadow:
0px 30px 90px rgba(0,0,0,.7),
0px 0px 35px rgba(0,242,254,.6);

}

/* ANIMATION */

@keyframes fadeUp{

from{
opacity:0;
transform:translateY(40px);
}

to{
opacity:1;
transform:translateY(0);
}

}

/* HEADING */

h2{

text-align:center;

font-size:28px;

font-weight:700;

margin-bottom:10px;

background:linear-gradient(90deg,#4facfe,#00f2fe);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

}

/* SUBTITLE */

.subtitle{

text-align:center;

font-size:14px;

color:#d0d0d0;

margin-bottom:25px;

}

/* INPUT GROUP */

.input-group{

margin-bottom:15px;

}

/* INPUT */

input{

width:100%;

padding:13px;

border-radius:10px;

border:1px solid rgba(255,255,255,.2);

background:rgba(255,255,255,.1);

color:white;

transition:.3s;

}

input::placeholder{
color:#ddd;
}

input:focus{

border-color:#4facfe;

box-shadow:0 0 10px rgba(79,172,254,.6);

outline:none;

}

/* BUTTON */

button{

width:100%;

padding:14px;

background:linear-gradient(90deg,#4facfe,#00f2fe);

color:white;

border:none;

border-radius:10px;

font-size:16px;

cursor:pointer;

transition:.3s;

}

button:hover{

transform:translateY(-3px);

box-shadow:0px 15px 30px rgba(0,0,0,.4);

}

/* FOOTER */

.footer{

margin-top:15px;

text-align:center;

font-size:13px;

color:#ddd;

}

.footer a{

color:#4facfe;

text-decoration:none;

font-weight:600;

}

/* TOAST MESSAGE */

.toast{

position:fixed;
top:20px;
right:-350px;

background:#ff4d4d;
color:white;

padding:14px 20px;

border-radius:8px;

box-shadow:0px 10px 25px rgba(0,0,0,.3);

transition:.5s;
z-index:999;

}

.toast.show{
right:20px;
}

.toast.success{
background:#28a745;
}

</style>

</head>

<body>

<a href="{% url 'home' %}" class="home-btn">🏠 Home</a>

<div class="container">

<h2>🏏 Cricket Auction Login</h2>

<div class="subtitle">
Access your bidding dashboard securely
</div>

<!-- 🔥 UPDATED FORM -->
<form method="POST" autocomplete="off">

{% csrf_token %}

<div class="input-group">

<input
type="text"
name="username"
placeholder="Username"
autocomplete="off"
required
>

</div>

<div class="input-group">

<input
type="password"
name="password"
placeholder="Password"
autocomplete="new-password"
required
>

</div>

<button>Login</button>

</form>

<div class="footer">
Don't have an account?
<a href="{% url 'register' %}">Register</a>
</div>

</div>

<!-- TOAST MESSAGE -->

{% for message in messages %}
<div class="toast {% if message.tags == 'success' %}success{% endif %}" id="toast">
{{ message }}
</div>
{% endfor %}

<script>

let toast = document.getElementById("toast");

if(toast){

setTimeout(()=>{
toast.classList.add("show");
},200);

setTimeout(()=>{
toast.classList.remove("show");
},3000);

}

</script>

</body>
</html>
